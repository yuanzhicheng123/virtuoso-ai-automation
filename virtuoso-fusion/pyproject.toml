[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtuoso-fusion"
version = "0.3.2"
description = "Unified Virtuoso engineering APIs with a provenance-backed SKILL registry"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18,<5",
  "virtuoso-bridge @ git+https://github.com/Arcadia-1/virtuoso-bridge-lite.git@672b451416b1ef3cc560db4196365075e94c8d4e",
]

[project.optional-dependencies]
ssh = ["paramiko>=3.5", "PySocks>=1.7.1"]
mcp-visuals = ["Pillow>=10.0"]
dev = ["pytest>=7", "build"]

[project.scripts]
virtuoso-fusion = "virtuoso_fusion.cli:main"
virtuoso-fusion-mcp = "virtuoso_fusion.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
virtuoso_fusion = ["_data/*", "_upstream/**/*", "_upstream/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
